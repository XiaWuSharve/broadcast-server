<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>唔？</title>
  <style>
    /* 极简样式：textarea 占满页面，等宽字体，舒适内边距 */
    html,body { height:100%; margin:0; }
    body { display:flex; align-items:stretch; }
    textarea {
      width:100%;
      height:100vh;
      box-sizing:border-box;
      padding:12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Segoe UI Mono", monospace;
      font-size:14px;
      line-height:1.4;
      resize:none;
      border:0;
      outline:none;
    }
  </style>
</head>
<body>
  <textarea id="box" spellcheck="false" autocomplete="off" autocapitalize="off"
            placeholder="正在连接 websocket..."></textarea>

  <script>
  (function(){
    const WS_URL = "ws://localhost:8080/ws";
    const ta = document.getElementById('box');

    // displayContent: 所有已确认显示（收到的消息 + 本地已发送并已追加的消息）
    // draft: 用户当前正在输入但尚未发送的文本
    let displayContent = "";
    let draft = "";
    let ws = null;
    let sendTimer = null;
    const DEBOUNCE_MS = 500; // 用户停止输入 500ms 后发送草稿（可改）
    let reconnectDelay = 1000; // 重连初始延迟
    let isConnected = false;

    // 将 textarea 的值设置为 displayContent + draft，并把光标放到 draft 末尾
    function render() {
      const combined = displayContent + draft;
      ta.value = combined;
      // 将光标放在草稿末尾（如果用户正输入），否则放在结尾
      const caretPos = (displayContent.length + draft.length);
      try {
        ta.setSelectionRange(caretPos, caretPos);
      } catch (e) {
        // 某些环境下可能失败，忽略
      }
      // 滚动到可见底部
      ta.scrollTop = ta.scrollHeight;
    }

    // 发送 draft（如果非空），并把它追加到 displayContent，然后清空 draft
    function sendDraftNow() {
      if (!isConnected) return;
      const toSend = draft;
      if (!toSend) return;
      try {
        ws.send(toSend);
      } catch (e) {
        console.warn("发送失败：", e);
        return;
      }
      // 本地追加已发送的消息到 displayContent（服务器不会回传你的消息）
      displayContent += toSend;
      draft = "";
      render();
    }

    // 处理输入事件：更新 draft，根据去抖发送
    ta.addEventListener('input', (ev) => {
      // textarea.value 可能被 displayContent 改写，因此计算 draft 为整体 - displayContent 前缀
      const full = ta.value;
      if (full.startsWith(displayContent)) {
        draft = full.slice(displayContent.length);
      } else {
        // 如果不以 displayContent 开头（异常情况，比如用户删除了之前显示内容），
        // 我们将把整个文本视为 displayContent（避免把收到的消息变成草稿）
        displayContent = full;
        draft = "";
      }

      // 去抖：在停止输入后发送
      if (sendTimer) clearTimeout(sendTimer);
      // 如果 draft 为空则不发送
      if (draft.length > 0) {
        sendTimer = setTimeout(() => {
          sendDraftNow();
          sendTimer = null;
        }, DEBOUNCE_MS);
      }
    });

    // 处理粘贴：立即发送粘贴内容（更即时）
    ta.addEventListener('paste', (ev) => {
      // 等一个 event loop 以便 input 事件先更新 draft，然后立即发送
      setTimeout(() => {
        if (sendTimer) clearTimeout(sendTimer);
        sendDraftNow();
      }, 0);
    });

    // 建立 websocket 并处理消息、关闭、错误
    function connect() {
      ta.placeholder = "正在连接 " + WS_URL + " ……";
      try {
        ws = new WebSocket(WS_URL);
      } catch (e) {
        console.error("WebSocket 构造失败：", e);
        scheduleReconnect();
        return;
      }

      ws.addEventListener('open', () => {
        isConnected = true;
        reconnectDelay = 1000; // 重置重连延迟
        ta.placeholder = "已连接 — 在文本框输入将自动发送消息";
        // render 以确保 placeholder 消失时显示正确内容
        render();
      });

      ws.addEventListener('message', (ev) => {
        // 假定接收的是文本消息
        const msg = String(ev.data);
        // 追加到 displayContent（保留 draft 不变）
        displayContent += msg;
        render();
      });

      ws.addEventListener('close', (ev) => {
        isConnected = false;
        ta.placeholder = "已断开，正在重连…";
        scheduleReconnect();
      });

      ws.addEventListener('error', (ev) => {
        console.warn("WebSocket 错误：", ev);
        // 错误后 close 事件也会触发，重连由 close 处理
      });
    }

    function scheduleReconnect() {
      // 在后台一秒起，指数退避，最大 30 秒
      const delay = Math.min(reconnectDelay, 30000);
      setTimeout(() => {
        connect();
      }, delay);
      reconnectDelay = Math.min(30000, reconnectDelay * 2);
    }

    // 在卸载或刷新页面时，尽量发送当前草稿并关闭连接
    window.addEventListener('beforeunload', (e) => {
      if (sendTimer) clearTimeout(sendTimer);
      if (draft && isConnected) {
        try { ws.send(draft); displayContent += draft; draft = ""; } catch(_) {}
      }
      if (ws) try { ws.close(); } catch(_) {}
    });

    // 初始渲染并连接
    render();
    connect();

    // 可选：快速调试工具（打开控制台看连接状态）
    window.__wsDebug = {
      get displayContent(){ return displayContent; },
      get draft(){ return draft; },
      get isConnected(){ return isConnected; },
      sendNow(){ if (sendTimer) clearTimeout(sendTimer); sendDraftNow(); },
      forceReconnect(){ if (ws) try { ws.close(); } catch(_){} connect(); }
    };
  })();
  </script>
</body>
</html>
