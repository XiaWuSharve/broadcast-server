syntax = "proto3";

package message;

option go_package = "datas/";
option java_package = "com.github.xiawusharve.webrtc";
// 不支持描述符、嵌套构建器
option optimize_for = LITE_RUNTIME;

// enum MessageType {
//   MESSAGE_TYPE_UNSPECIFIED = 0;
//   CONNECT                  = 1;
//   CHAT                     = 2;
//   CANDIDATE                = 3;
// }

// TODO 不知道是否合理，到时候再改吧
message Message {
  // MessageType type = 1;
  string sender_id    = 2;
  string receiver_id  = 3;
  int64  created_time = 4;
  string message_id   = 11;
  int64 conn_id = 12;
  oneof data {
    Ack ack = 6;
    // Connect   connect   = 5;
    Candidate candidate = 7;
    Chat      chat      = 8;
    Sdp       call      = 9;
    Sdp       answer    = 10;
  }
}

message Sdp {
  string sdp = 2;
}

// 已有的消息与枚举
message Connect {
  string display_name = 1;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  SENDING                = 4;
  SENT                   = 5;
  FAIL                   = 3;
}

message Ack {
  AckStatus status     = 1;
  string    reason     = 3;
  string    message_id = 2;
}

message Candidate {
  string sdp_mid         = 2;
  int32  sdp_mline_index = 3;
  string sdp             = 4;
}

// 从 ChatMessage 迁移
message Chat {
  string               display_name  = 2;
  repeated MessageUnit message_chain = 3;
}

// 从 Go 的 MessageUnitType 常量迁移来的枚举
enum MessageUnitType {
  MESSAGE_UNIT_TYPE_UNSPECIFIED = 0;  // proto3 要求第一个值为 0
  TEXT                          = 1;
  CALL                          = 2;
  ANSWER                        = 3;
  ESTABLISH                     = 4;
}

// 从 MessageUnit 迁移
message MessageUnit {
  MessageUnitType type    = 1;
  string          message = 2;
}